<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>維修客戶與零件雲端管理後台</title>
    <!-- 引入 Tailwind CSS 確保畫面精美 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Firebase 核心與即時資料庫 SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">

    <div class="container mx-auto p-4 md:p-6 max-w-7xl">
        <!-- 頂部標題區 -->
        <header class="mb-6 bg-white p-6 rounded-lg shadow-sm border border-gray-200">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 flex items-center gap-2">
                🛠️ 雲端維修與零件整合管理系統
            </h1>
            <p class="text-sm text-gray-500 mt-1">即時同步 Firebase Database · 支援智慧型 Excel 格式 CSV 資料備份與整批匯入</p>
        </header>

        <!-- 主區塊：左右/上下 雙模組佈局 -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- ======================================================= -->
            <!-- 💼 模組一：維修客戶管理 (佔 2 分之 3 寬度) -->
            <!-- ======================================================= -->
            <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex flex-col">
                <h2 class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b">💼 客戶維修案件管理</h2>
                
                <!-- 智慧控制區：搜尋與動態功能按鈕 -->
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">
                    <div class="w-full md:w-64">
                        <input type="text" id="searchPhone" placeholder="🔍 輸入電話號碼即時搜尋..." 
                               class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button id="openAddModalBtn" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-medium shadow hover:bg-blue-700 transition">
                            ➕ 新增維修紀錄
                        </button>
                        <button id="exportRepairBtn" class="bg-green-600 text-white px-4 py-2 rounded text-sm font-medium shadow hover:bg-green-700 transition">
                            📥 匯出 CSV 備份
                        </button>
                        <!-- 隱藏的檔案選擇器與匯入按鈕 -->
                        <input type="file" id="importRepairInput" accept=".csv" class="hidden" />
                        <button id="importRepairBtn" class="bg-purple-600 text-white px-4 py-2 rounded text-sm font-medium shadow hover:bg-purple-700 transition">
                            📤 匯入 Excel 舊檔
                        </button>
                    </div>
                </div>

                <!-- 資料表格區 -->
                <div class="overflow-x-auto border rounded-lg">
                    <table class="min-w-full divide-y divide-gray-200 text-left">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">客戶姓名</th>
                                <th class="px-4 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">聯絡電話</th>
                                <th class="px-4 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">設備項目</th>
                                <th class="px-4 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">狀況描述</th>
                                <th class="px-4 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">案件進度</th>
                                <th class="px-4 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider">建檔時間</th>
                                <th class="px-4 py-3 text-xs font-bold text-gray-500 uppercase tracking-wider text-right">操作動作</th>
                            </tr>
                        </thead>
                        <tbody id="repairTableBody" class="bg-white divide-y divide-gray-200 text-sm">
                            <tr>
                                <td colspan="7" class="px-4 py-8 text-center text-gray-400">雲端資料載入中...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <p class="text-xs text-gray-400 mt-2">💡 預設僅列出最新 10 筆案件，使用關鍵字搜尋時將會解鎖顯示完整相符資料。</p>
            </div>

            <!-- ======================================================= -->
            <!-- 🔧 模組二：通用零件庫存盤點 (佔 1 分之 3 寬度) -->
            <!-- ======================================================= -->
            <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
                <h2 class="text-xl font-bold text-gray-800 mb-4 pb-2 border-b">🔧 零件與耗材庫存變更</h2>
                
                <!-- 快速新增零件表單 -->
                <form id="partForm" class="bg-gray-50 p-4 rounded-lg mb-4 border space-y-3">
                    <input type="hidden" id="partId" />
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">零件名稱 / 規格</label>
                        <input type="text" id="partName" required placeholder="例如：耐磨貓抓皮 (焦糖色)" class="w-full border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1">目前庫存量</label>
                            <input type="number" id="partStock" required min="0" placeholder="0" class="w-full border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1">安全庫存水位</label>
                            <input type="number" id="partMin" required min="0" placeholder="5" class="w-full border rounded px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                        </div>
                    </div>
                    <button type="submit" id="partSubmitBtn" class="w-full bg-slate-700 text-white text-sm py-2 rounded font-medium hover:bg-slate-800 transition">
                        💾 儲存並更新庫存
                    </button>
                    <button type="button" id="cancelPartEditBtn" class="w-full bg-gray-200 text-gray-700 text-sm py-1 rounded hidden hover:bg-gray-300 transition">
                        取消修改
                    </button>
                </form>

                <!-- 零件即時動態清單 -->
                <div class="space-y-2 max-h-[400px] overflow-y-auto pr-1" id="partsContainer">
                    <p class="text-center text-sm text-gray-400 py-4">庫存清單載入中...</p>
                </div>
            </div>

        </div>
    </div>

    <!-- ======================================================= -->
    <!-- 🖥️ 隱藏彈窗 (Modal)：維修紀錄新增/修改表單 -->
    <!-- ======================================================= -->
    <div id="repairModal" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full overflow-hidden border">
            <div class="bg-gray-900 px-6 py-4 flex items-center justify-between">
                <h3 id="modalTitle" class="text-lg font-bold text-white">新增維修紀錄</h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-white text-xl">&times;</button>
            </div>
            <form id="repairForm" class="p-6 space-y-4">
                <input type="hidden" id="repairId" />
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">客戶姓名 *</label>
                    <input type="text" id="customerName" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">聯絡電話 *</label>
                    <input type="tel" id="customerPhone" required class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">設備項目/物件種類</label>
                    <input type="text" id="itemType" placeholder="例如：貓抓皮床底、實木餐椅" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">案件狀況描述</label>
                    <textarea id="issueDescription" rows="3" placeholder="例如：邊角破損需重新包皮、更換加厚高密度海綿" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">目前進度狀態</label>
                    <select id="repairStatus" class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="待處理">🔴 待處理</option>
                        <option value="維修中">🟡 維修中</option>
                        <option value="已完成">🟢 已完成</option>
                    </select>
                </div>
                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" id="cancelModalBtn" class="bg-gray-100 text-gray-700 px-4 py-2 rounded text-sm hover:bg-gray-200">取消</button>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">儲存寫入雲端</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- ⚙️ JavaScript 核心程式控制邏輯區 -->
    <!-- ======================================================= -->
    <script>
        // 1. 📢 請於此處填入您專屬的 Firebase 配置參數
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let repairDataCache = {}; // 維修客戶本地快取資料

        // -----------------------------------------------------------
        // 💼 [功能一] 維修客戶管理系統邏輯 (即時監聽 / 渲染 / CRUD)
        // -----------------------------------------------------------
        
        // 監聽 Firebase 雲端資料庫更新
        db.ref("repairs").on("value", (snapshot) => {
            repairDataCache = snapshot.val() || {};
            refreshRepairUI(repairDataCache);
        }, (error) => {
            console.error("Firebase 讀取失敗:", error);
            alert("雲端連線失敗，請確認 Firebase 設定是否填寫正確。");
        });

        // 刷新維修表格畫面
        function refreshRepairUI(data, filterPhone = "") {
            const tbody = document.getElementById("repairTableBody");
            tbody.innerHTML = "";
            
            // 轉化物件為陣列並按建立時間倒序排序
            const records = Object.keys(data).map(key => ({ id: key, ...data[key] }))
                .filter(item => !filterPhone || (item.phone && item.phone.includes(filterPhone)))
                .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

            if (records.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="px-4 py-8 text-center text-gray-400">🔍 找不到對應的維修客戶紀錄</td></tr>`;
                return;
            }

            // 若沒有進行搜尋，預設只截取最前面的 10 筆，避免歷史死資料撐爆畫面
            const displayRecords = filterPhone ? records : records.slice(0, 10);

            displayRecords.forEach(item => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-gray-50 border-b";
                tr.innerHTML = `
                    <td class="px-4 py-3 font-medium text-gray-900">${item.customerName || '-'}</td>
                    <td class="px-4 py-3 text-gray-600">${item.phone || '-'}</td>
                    <td class="px-4 py-3 text-gray-600">${item.itemType || '-'}</td>
                    <td class="px-4 py-3 text-gray-500 max-w-xs truncate" title="${item.issueDescription || ''}">${item.issueDescription || '-'}</td>
                    <td class="px-4 py-3">
                        <span class="px-2.5 py-1 text-xs font-semibold rounded-full ${getStatusStyle(item.status)}">
                            ${item.status || '待處理'}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-xs text-gray-400">${formatDate(item.createdAt)}</td>
                    <td class="px-4 py-3 text-right font-medium space-x-2">
                        <button onclick="editRepair('${item.id}')" class="text-blue-600 hover:text-blue-900">修改</button>
                        <button onclick="deleteRepair('${item.id}')" class="text-red-600 hover:text-red-900">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 客戶表單提交事件 (相容 新增與編輯)
        document.getElementById("repairForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const id = document.getElementById("repairId").value;
            const now = new Date().toISOString();
            
            const payload = {
                customerName: document.getElementById("customerName").value.trim(),
                phone: document.getElementById("customerPhone").value.trim(),
                itemType: document.getElementById("itemType").value.trim(),
                issueDescription: document.getElementById("issueDescription").value.trim(),
                status: document.getElementById("repairStatus").value,
                updatedAt: now
            };

            if (id) {
                // 編輯模式
                db.ref(`repairs/${id}`).update(payload)
                    .then(() => { closeRepairModal(); })
                    .catch(err => alert("修改資料發生錯誤：" + err.message));
            } else {
                // 全新新增模式
                payload.createdAt = now;
                db.ref("repairs").push(payload)
                    .then(() => { closeRepairModal(); })
                    .catch(err => alert("上傳雲端發生錯誤：" + err.message));
            }
        });

        // 啟動關鍵字模糊搜尋
        document.getElementById("searchPhone").addEventListener("input", function(e) {
            refreshRepairUI(repairDataCache, e.target.value.trim());
        });

        // 刪除維修數據
        function deleteRepair(id) {
            if (confirm("⚠️ 注意！您確定要徹底刪除此筆客戶維修紀錄嗎？")) {
                db.ref(`repairs/${id}`).remove().catch(err => alert("刪除失敗: " + err.message));
            }
        }

        // 開啟編輯表單
        function editRepair(id) {
            const item = repairDataCache[id];
            if (!item) return;
            document.getElementById("repairId").value = id;
            document.getElementById("customerName").value = item.customerName || "";
            document.getElementById("customerPhone").value = item.phone || "";
            document.getElementById("itemType").value = item.itemType || "";
            document.getElementById("issueDescription").value = item.issueDescription || "";
            document.getElementById("repairStatus").value = item.status || "待處理";
            
            document.getElementById("modalTitle").innerText = "🔧 變更修改維修紀錄";
            document.getElementById("repairModal").classList.remove("hidden");
        }

        // -----------------------------------------------------------
        // 📊 [功能二] 🟢 核心擴充：Excel 規格 CSV 檔案雙向匯出與匯入
        // -----------------------------------------------------------
        
        // 一鍵備份匯出功能 (特別追加 Excel 補丁，防止繁體中文發生亂碼)
        document.getElementById("exportRepairBtn").addEventListener("click", () => {
            const keys = Object.keys(repairDataCache);
            if (keys.length === 0) {
                alert("目前雲端無資料可以執行匯出備份。");
                return;
            }
            
            let csvText = "客戶姓名,電話,設備項目,進度狀態,狀況描述,建立時間\n";
            keys.forEach(key => {
                const item = repairDataCache[key];
                const row = [
                    `"${(item.customerName || '').replace(/"/g, '""')}"`,
                    `"${(item.phone || '').replace(/"/g, '""')}"`,
                    `"${(item.itemType || '').replace(/"/g, '""')}"`,
                    `"${(item.status || '待處理')}"`,
                    `"${(item.issueDescription || '').replace(/"/g, '""')}"`,
                    `"${formatDate(item.createdAt)}"`
                ];
                csvText += row.join(",") + "\n";
            });

            // 加上 \ufeff (BOM 字頭)，確保微軟 Excel 直接按兩下開啟時，繁體中文與電話能完美辨識不亂碼
            const blob = new Blob(["\ufeff" + csvText], { type: "text/csv;charset=utf-8;" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `維修大師資料備份_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // 點擊觸發檔案選取視窗
        document.getElementById("importRepairBtn").addEventListener("click", () => {
            document.getElementById("importRepairInput").click();
        });

        // 檔案匯入核心解析邏輯
        document.getElementById("importRepairInput").addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const content = evt.target.result;
                const rows = content.split(/\r?\n/);
                if (rows.length <= 1) {
                    alert("匯入失敗：選取的檔案內部無任何有效資料。");
                    return;
                }

                const batchUpdates = {};
                const nowTimestamp = new Date().toISOString();
                let loadedCount = 0;

                // 從第二行 (i=1) 開始跑迴圈，主動跳過 Excel 的第一列中文標頭
                for (let i = 1; i < rows.length; i++) {
                    const currentRow = rows[i].trim();
                    if (!currentRow) continue; // 略過空白列

                    // 切分 CSV 欄位（移除頭尾雙引號）
                    const cols = currentRow.split(",").map(cell => cell.replace(/^"|"$/g, '').trim());
                    
                    // 檢查基本門檻：前兩個關鍵欄位(姓名、電話)不能是空值
                    if (!cols[0] || !cols[1]) {
                        console.warn(`第 ${i+1} 行欄位格式不齊全，已自動跳過。`);
                        continue;
                    }

                    // 動態向 Firebase 預取一組不重複的專屬加密 Key
                    const newFirebaseKey = db.ref().child('repairs').push().key;

                    // 映射配置成系統標準的物件資料
                    batchUpdates[`/repairs/${newFirebaseKey}`] = {
                        customerName: cols[0],
                        phone: cols[1],
                        itemType: cols[2] || "通用項目",
                        status: cols[3] || "待處理",
                        issueDescription: cols[4] || "無細部描述",
                        createdAt: nowTimestamp,
                        updatedAt: nowTimestamp
                    };
                    loadedCount++;
                }

                if (loadedCount > 0) {
                    if (confirm(`🔍 偵測完畢！確認要整批匯入這 ${loadedCount} 筆客戶歷史資料至雲端資料庫嗎？`)) {
                        db.ref().update(batchUpdates)
                            .then(() => {
                                alert(`🎉 恭喜！已成功匯入 ${loadedCount} 筆維修案至雲端系統。`);
                                document.getElementById("importRepairInput").value = ""; // 清除選擇器快取
                            })
                            .catch(err => alert("寫入雲端失敗: " + err.message));
                    }
                } else {
                    alert("沒有找到任何符合格式的資料行，請確認欄位配置順序。");
                }
            };

            // 使用網頁通用繁體中文編碼讀取
            reader.readAsText(file, "UTF-8");
        });


        // -----------------------------------------------------------
        // 🔧 [功能三] 零件與耗材庫存變更模組邏輯
        // -----------------------------------------------------------
        
        // 監聽零件資料庫變更
        db.ref("parts").on("value", (snapshot) => {
            const partsData = snapshot.val() || {};
            refreshPartUI(partsData);
        });

        // 提交零件表單 (新增 / 變更庫存數)
        document.getElementById("partForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const id = document.getElementById("partId").value;
            const payload = {
                partName: document.getElementById("partName").value.trim(),
                stock: parseInt(document.getElementById("partStock").value) || 0,
                minRequired: parseInt(document.getElementById("partMin").value) || 0
            };

            if (id) {
                db.ref(`parts/${id}`).update(payload).then(() => resetPartForm());
            } else {
                db.ref("parts").push(payload).then(() => resetPartForm());
            }
        });

        // 渲染零件小卡列表
        function refreshPartUI(data) {
            const container = document.getElementById("partsContainer");
            container.innerHTML = "";
            const keys = Object.keys(data);

            if (keys.length === 0) {
                container.innerHTML = `<p class="text-center text-sm text-gray-400 py-4">目前尚無零件庫存清單</p>`;
                return;
            }

            keys.forEach(key => {
                const item = data[key];
                const isLowStock = item.stock <= item.minRequired; // 判斷是否低於安全水位
                
                const div = document.createElement("div");
                div.className = `p-3 rounded-lg border text-sm flex items-center justify-between transition ${isLowStock ? 'bg-red-50 border-red-200' : 'bg-white border-gray-200'}`;
                div.innerHTML = `
                    <div>
                        <div class="font-semibold text-gray-900">${item.partName || '未命名耗材'}</div>
                        <div class="text-xs text-gray-500 mt-0.5">
                            目前庫存：<span class="font-bold ${isLowStock ? 'text-red-600 text-base' : 'text-gray-700'}">${item.stock}</span> 
                            (安全水位: ${item.minRequired})
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="quickAdjustStock('${key}', 1)" class="bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded font-bold text-xs">+1</button>
                        <button onclick="quickAdjustStock('${key}', -1)" class="bg-gray-200 hover:bg-gray-300 px-2 py-1 rounded font-bold text-xs">-1</button>
                        <button onclick="editPart('${key}')" class="text-indigo-600 hover:text-indigo-900 ml-2 text-xs">改</button>
                        <button onclick="deletePart('${key}')" class="text-red-500 hover:text-red-800 text-xs">✕</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // 快速微調庫存 (+1 / -1 按鈕)
        function quickAdjustStock(id, change) {
            const node = db.ref(`parts/${id}/stock`);
            node.transaction((currentStock) => {
                return Math.max(0, (currentStock || 0) + change);
            });
        }

        function editPart(id) {
            db.ref(`parts/${id}`).once("value", (snap) => {
                const item = snap.val();
                if (!item) return;
                document.getElementById("partId").value = id;
                document.getElementById("partName").value = item.partName || "";
                document.getElementById("partStock").value = item.stock || 0;
                document.getElementById("partMin").value = item.minRequired || 0;
                document.getElementById("partSubmitBtn").innerText = "🔄 確定修改零件規格";
                document.getElementById("cancelPartEditBtn").classList.remove("hidden");
            });
        }

        function deletePart(id) {
            if (confirm("確定要將此零件項目從庫存清單中移除嗎？")) {
                db.ref(`parts/${id}`).remove();
            }
        }

        function resetPartForm() {
            document.getElementById("partForm").reset();
            document.getElementById("partId").value = "";
            document.getElementById("partSubmitBtn").innerText = "💾 儲存並更新庫存";
            document.getElementById("cancelPartEditBtn").classList.add("hidden");
        }
        document.getElementById("cancelPartEditBtn").addEventListener("click", resetPartForm);


        // -----------------------------------------------------------
        // 🧱 [功能四] 基礎通用工具輔助函式
        // -----------------------------------------------------------
        function getStatusStyle(status) {
            switch(status) {
                case "已完成": return "bg-green-100 text-green-800";
                case "維修中": return "bg-yellow-100 text-yellow-800";
                default: return "bg-red-100 text-red-800"; // 待處理
            }
        }

        function formatDate(isoString) {
            if (!isoString) return "-";
            try {
                const d = new Date(isoString);
                return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            } catch(e) { return "-"; }
        }

        function closeRepairModal() {
            document.getElementById("repairModal").classList.add("hidden");
            document.getElementById("repairForm").reset();
            document.getElementById("repairId").value = "";
        }

        document.getElementById("openAddModalBtn").addEventListener("click", () => {
            document.getElementById("modalTitle").innerText = "➕ 新增客戶維修紀錄";
            document.getElementById("repairForm").reset();
            document.getElementById("repairId").value = "";
            document.getElementById("repairModal").classList.remove("hidden");
        });
        document.getElementById("closeModalBtn").addEventListener("click", closeRepairModal);
        document.getElementById("cancelModalBtn").addEventListener("click", closeRepairModal);
    </script>
</body>
</html>
